<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Selected engineering projects by Eya Dabbaghi</title><desc id="description">Four dark plum project cards for EverCare, AI and RAG, DevOps and CI/CD, and FitTrack AI.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#140B12"/><stop offset="1" stop-color="#22101C"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F9A8D4"/><stop offset="1" stop-color="#DB2777"/></linearGradient></defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/><text x="48" y="55" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Selected Projects</text><text x="48" y="80" fill="#D9D0D6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">A snapshot of the systems and workflows I work on</text><path d="M48 98H1152" stroke="url(#line)" stroke-opacity=".55"/>
