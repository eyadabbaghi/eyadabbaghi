    <rect x="616" y="119" width="536" height="174" rx="15" fill="#1C111A" stroke="#F9A8D4" stroke-opacity=".26"/><rect x="616" y="119" width="4" height="174" rx="2" fill="#F9A8D4"/><circle cx="659" cy="158" r="21" fill="#F9A8D4" fill-opacity=".13" stroke="#F9A8D4" stroke-opacity=".42"/><path d="M649 152H669M649 158H663M649 164H666M667 156L672 161L667 166" stroke="#FBCFE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="694" y="155" fill="#F8FAFC" font-size="18" font-weight="700">AI / RAG &amp; LLM Work</text><text x="694" y="176" fill="#DCE3EA" font-size="12.5">Retrieval-augmented generation and LLM-assisted</text><text x="694" y="194" fill="#DCE3EA" font-size="12.5">workflows built with Python and FastAPI.</text><rect x="694" y="218" width="67" height="25" rx="12.5" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".38"/><text x="713" y="235" fill="#FBCFE8" font-size="11" font-weight="600">Python</text><rect x="770" y="218" width="75" height="25" rx="12.5" fill="#F9A8D4" fill-opacity=".10" stroke="#F9A8D4" stroke-opacity=".38"/><text x="788" y="235" fill="#FBCFE8" font-size="11" font-weight="600">FastAPI</text>
